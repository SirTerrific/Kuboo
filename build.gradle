// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.3.21'
    ext.kotlin_coroutines_version = '1.1.1'
    repositories {
        mavenCentral()
        google()
        // JCenter was shut down; this read-only mirror still serves the 2019-era artifacts
        // that were never republished to Maven Central. See README for the affected deps.
        maven { url "https://maven.aliyun.com/repository/jcenter" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // NOTE: Do not place your application dependencies here; they belong in the individual module build.gradle files
    }
}
allprojects {
    repositories {
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
        maven { url 'http://maven.ghostscript.com/' }
        google()
        maven { url "https://maven.aliyun.com/repository/jcenter" }
    }
}
task clean(type: Delete) {
    delete rootProject.buildDir
}