# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/currentBook/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m
org.gradle.caching=true
android.useAndroidX=true
# rtlviewpager (and other 2016-era aars) still depend on the pre-AndroidX support
# library; Jetifier rewrites them on the fly. Required until those are replaced.
android.enableJetifier=true

# Butterknife's generated code needs R.id values to be compile-time constants.
# AGP 8 makes resource ids non-final by default, which breaks its annotation
# processor ("element value must be a constant expression"). Restore final ids.
# Can be dropped once Butterknife is replaced by view binding.
android.nonFinalResIds=false
# AGP 8 also stops merging library R classes into the app R; BaseRecyclerViewAdapterHelper
# references its own ids through the app R, so keep the transitive behaviour.
android.nonTransitiveRClass=false

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/currentBook/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
